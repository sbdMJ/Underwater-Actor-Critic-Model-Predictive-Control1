disturbances:
  train:
    flow:
      enable_flow: true
      max_flow_velocity: [0.5, 0.5, 0.5, 0.0, 0.0, 0.0]
      flow_velocity_gaussian_noise: [0.02, 0.02, 0.02, 0.0, 0.0, 0.0]
      update_mode: ou
      init_mode: uniform_signed
      tau: 2.0
      sigma: [0.03, 0.03, 0.03, 0.0, 0.0, 0.0]
      zero_vertical: true
    payload:
      enable_payload: true
      mass: [0.01, 0.2]
      z: [-0.1, 0.1]
    
  evaluate:
    flow:
      enable_flow: true
      max_flow_velocity: [0.5, 0.5, 0.5, 0.0, 0.0, 0.0]
      flow_velocity_gaussian_noise: [0.1, 0.1, 0.1, 0.0, 0.0, 0.0]
      zero_vertical: true
    payload:
      enable_payload: true
      mass: [0.01, 0.2] # scale of the body mass, not kg
      z: [-0.1, 0.1]
