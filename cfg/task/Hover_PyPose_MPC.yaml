name: HoverPyPoseMPC

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - randomization@_here_
  - disturbances@_here_

env:
  num_envs: 1
  env_spacing: 6
  max_episode_length: 400


sim:
  device: cuda:0
  use_gpu_pipeline: true
  use_gpu: true

drone_model:
  name: BlueROV
  controller: PyPoseMPCController

force_sensor: false
time_encoding: true

reward_effort_weight: 0.1
reward_action_smoothness_weight: 0.0
reward_distance_scale: 1.2

# PyPose MPC(iLQR) 설정
mpc_horizon: 3
mpc_ilqr_iters: 2
mpc_q_pos: 50.0
mpc_q_quat: 30.0
mpc_q_vel: 2.0
mpc_q_omega: 0.5
mpc_r_u: 0.02
max_thruster_force: 40.0
thrust_axis: 0
# mpc_debug_print_B: true

random_target_pos: true
target_pos_min: [-1.0, -1.0, 1.5]
target_pos_max: [1.0, 1.0, 2.5]

terminate_distance: 10.0
terminate_min_z: 0.1

action_transform: null

# If true, the env overwrites RL actions with its own MPC output each step.
# For RL training with `algo=ppo_pypose_mpc_qrdiag`, `algo=ppo_pypose_mpc_qrdiag_tv`,
# or `algo=ppo_pypose_mpc_qrconst`, set this to false (or override via Hydra).
use_internal_mpc: true
