task:
  env:
    num_envs: 16
    env_spacing: 6
    max_episode_length: 200
  sim:
    dt: 0.016
    substeps: 1
    gravity:
    - 0
    - 0
    - -9.81
    replicate_physics: false
    use_flatcache: true
    use_gpu_pipeline: true
    device: cuda:0
    solver_type: 1
    use_gpu: true
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    enable_stabilization: true
    gpu_max_rigid_contact_count: 524288
    gpu_max_rigid_patch_count: 163840
    gpu_found_lost_pairs_capacity: 4194304
    gpu_found_lost_aggregate_pairs_capacity: 33554432
    gpu_total_aggregate_pairs_capacity: 4194304
    gpu_max_soft_body_contacts: 1048576
    gpu_max_particle_contacts: 1048576
    gpu_heap_capacity: 67108864
    gpu_temp_buffer_capacity: 16777216
    gpu_max_num_partitions: 8
  randomization:
    train:
      enable_randomization: false
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.9
        - 1.1
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
    evaluate:
      enable_randomization: true
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.8
        - 1.2
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
  disturbances:
    train:
      flow:
        enable_flow: false
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: false
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
    evaluate:
      flow:
        enable_flow: true
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: true
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
  name: Hover
  drone_model:
    name: BlueROV
    controller: LeePositionController
  force_sensor: false
  time_encoding: true
  reward_distance_scale: 1.2
  reward_effort_weight: 0.0
  reward_action_smoothness_weight: 0.0
  reward_orientation_weight: 0.5
  reward_orientation_scale: 5.0
  random_target_pos: false
  target_pos_min:
  - -1.0
  - -1.0
  - 1.5
  target_pos_max:
  - 1.0
  - 1.0
  - 2.5
  random_target_yaw: true
  target_rpy_min:
  - -0.1
  - -0.1
  - 0.0
  target_rpy_max:
  - 0.1
  - 0.1
  - 2.0
  include_target_quat_in_obs: true
  init_pos_min:
  - -1.0
  - -1.0
  - 1.5
  init_pos_max:
  - 1.0
  - 1.0
  - 2.5
  init_rpy_min:
  - -0.1
  - -0.1
  - 0.0
  init_rpy_max:
  - 0.1
  - 0.1
  - 2.0
  action_transform: null
algo:
  name: ac_mpc_pypose
  train_every: 32
  ppo_epochs: 4
  num_minibatches: 16
  priv_actor: false
  priv_critic: false
  checkpoint_path: null
  use_mpc_head: true
  entropy_coef: 0.01
  actor_log_std_init: 0.0
  actor_log_std_min: -2.0
  actor_log_std_max: 1.0
  obs_has_target_quat: false
  obs_time_encoding_dim: 0
  mpc_N: 10
  mpc_dt: 0.02
  mpc_nx: 12
  mpc_nu: 6
  mpc_param_yaml: null
  mpc_alloc_npz: null
  mpc_uabs_eps: 0.001
  mpc_ilqr_iters: 3
  mpc_lqr_reg: 0.0001
  cost_q_lb: 0.1
  cost_q_ub: 100000.0
  cost_p_lb: 0.1
  cost_p_ub: 100000.0
  cost_hidden: 512
  water_density: 997.0
  gravity: 9.81
  mpc_state_mode: hover_obs
  mpc_mass: null
  mpc_inertia: null
  acados_codegen_dir: ./acados_codegen
  acados_json: null
headless: false
enable_livestream: false
mode: train
sim: ${task.sim}
env:
  num_envs: ${task.env.num_envs}
  env_spacing: ${task.env.env_spacing}
  max_episode_length: ${task.env.max_episode_length}
total_frames: 20000000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
viewer:
  resolution:
  - 2460
  - 1440
  eye:
  - 8
  - 0.0
  - 6.0
  lookat:
  - 0.0
  - 0.0
  - 3.0
wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-${oc.select:..task.drone_model.name,none}
  job_type: train
  entity: your_wandb_entity_here
  project: marine_gym
  mode: offline
  run_id: null
  monitor_gym: true
  tags: null
