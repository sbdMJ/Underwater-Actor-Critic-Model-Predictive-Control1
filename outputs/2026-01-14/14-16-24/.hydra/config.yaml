task:
  env:
    num_envs: 1
    env_spacing: 6
    max_episode_length: 1800
  sim:
    dt: 0.016
    substeps: 1
    gravity:
    - 0
    - 0
    - -9.81
    replicate_physics: false
    use_flatcache: true
    use_gpu_pipeline: false
    device: cpu
    solver_type: 1
    use_gpu: false
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    enable_stabilization: true
    gpu_max_rigid_contact_count: 524288
    gpu_max_rigid_patch_count: 163840
    gpu_found_lost_pairs_capacity: 4194304
    gpu_found_lost_aggregate_pairs_capacity: 33554432
    gpu_total_aggregate_pairs_capacity: 4194304
    gpu_max_soft_body_contacts: 1048576
    gpu_max_particle_contacts: 1048576
    gpu_heap_capacity: 67108864
    gpu_temp_buffer_capacity: 16777216
    gpu_max_num_partitions: 8
  randomization:
    train:
      enable_randomization: false
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.9
        - 1.1
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
    evaluate:
      enable_randomization: true
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.8
        - 1.2
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
  disturbances:
    train:
      flow:
        enable_flow: false
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: false
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
    evaluate:
      flow:
        enable_flow: true
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: true
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
  name: OrbitCylinderMPC
  drone_model:
    name: BlueROV
    controller: MPCController
  force_sensor: false
  time_encoding: true
  reward_effort_weight: 0.1
  reward_action_smoothness_weight: 0.0
  reward_distance_scale: 1.2
  mpc_horizon: 20
  mpc_r_u: 0.01
  mpc_q_radial: 50.0
  mpc_q_z: 30.0
  mpc_q_tan: 10.0
  mpc_q_radial_speed: 5.0
  mpc_q_heading: 30.0
  mpc_q_roll: 60.0
  mpc_q_pitch: 60.0
  mpc_q_wxy: 0.5
  mpc_max_thruster_force: 40.0
  thrust_axis: 0
  cylinder_center:
  - 0.0
  - 0.0
  - 1.5
  cylinder_radius: 0.4
  cylinder_height: 3.0
  cylinder:
    color:
    - 0.9
    - 0.4
    - 0.1
  orbit_clearance: 1.0
  orbit_radius: 1.4
  orbit_z: 1.5
  orbit_period_steps: 600
  orbit_direction: 1.0
  orbit_yaw_offset: 0.0
  hide_target_vis: true
  orbit_v_tan: 0.0
  random_target_pos: false
  random_target_yaw: false
  init_pos_min:
  - 1.0
  - -0.3
  - 1.4
  init_pos_max:
  - 1.8
  - 0.3
  - 1.6
  init_rpy_min:
  - 0.0
  - 0.0
  - 0.0
  init_rpy_max:
  - 0.0
  - 0.0
  - 0.0
  terminate_distance: 10.0
  terminate_min_z: 0.1
  action_transform: null
algo:
  name: ppo
  train_every: 32
  ppo_epochs: 4
  num_minibatches: 16
  priv_actor: false
  priv_critic: false
  checkpoint_path: null
headless: false
enable_livestream: false
mode: train
sim: ${task.sim}
env:
  num_envs: 1
  env_spacing: ${task.env.env_spacing}
  max_episode_length: ${task.env.max_episode_length}
total_frames: 20000000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
viewer:
  resolution:
  - 2460
  - 1440
  eye:
  - 8
  - 0.0
  - 6.0
  lookat:
  - 0.0
  - 0.0
  - 3.0
wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-${oc.select:..task.drone_model.name,none}
  job_type: train
  entity: your_wandb_entity_here
  project: marine_gym
  mode: offline
  run_id: null
  monitor_gym: true
  tags: null
camera:
  head_offset:
  - 0.4
  - 0
  - 0.15
