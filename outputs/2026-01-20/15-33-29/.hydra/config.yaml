task:
  env:
    num_envs: 1
    env_spacing: 6
    max_episode_length: 400
  sim:
    dt: 0.016
    substeps: 1
    gravity:
    - 0
    - 0
    - -9.81
    replicate_physics: false
    use_flatcache: true
    use_gpu_pipeline: false
    device: cpu
    solver_type: 1
    use_gpu: false
    bounce_threshold_velocity: 0.2
    friction_offset_threshold: 0.04
    friction_correlation_distance: 0.025
    enable_stabilization: true
    gpu_max_rigid_contact_count: 524288
    gpu_max_rigid_patch_count: 163840
    gpu_found_lost_pairs_capacity: 4194304
    gpu_found_lost_aggregate_pairs_capacity: 33554432
    gpu_total_aggregate_pairs_capacity: 4194304
    gpu_max_soft_body_contacts: 1048576
    gpu_max_particle_contacts: 1048576
    gpu_heap_capacity: 67108864
    gpu_temp_buffer_capacity: 16777216
    gpu_max_num_partitions: 8
  randomization:
    train:
      enable_randomization: false
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.9
        - 1.1
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
    evaluate:
      enable_randomization: true
      body:
        mass_scale:
        - 0.8
        - 1.2
        volume_scale:
        - 0.8
        - 1.2
        coBM_scale:
        - 0.5
        - 1.5
        inertia_scale:
        - 0.8
        - 1.2
        added_mass_scale:
        - 0.5
        - 1.0
        linear_damping_scale:
        - 0.5
        - 1.0
        quadratic_damping_scale:
        - 0.5
        - 1.0
      rotor:
        time_constants_scale:
        - 0.8
        - 1.2
        force_constants_scale:
        - 0.8
        - 1.2
  disturbances:
    train:
      flow:
        enable_flow: false
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: false
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
    evaluate:
      flow:
        enable_flow: true
        max_flow_velocity:
        - 0.5
        - 0.5
        - 0.5
        - 0.0
        - 0.0
        - 0.0
        flow_velocity_gaussian_noise:
        - 0.1
        - 0.1
        - 0.1
        - 0.0
        - 0.0
        - 0.0
      payload:
        enable_payload: true
        mass:
        - 0.01
        - 0.2
        z:
        - -0.1
        - 0.1
  name: HoverPyPoseMPC
  drone_model:
    name: BlueROV
    controller: PyPoseMPCController
  force_sensor: false
  time_encoding: true
  reward_effort_weight: 0.1
  reward_action_smoothness_weight: 0.0
  reward_distance_scale: 1.2
  mpc_horizon: 15
  mpc_ilqr_iters: 6
  mpc_q_pos: 50.0
  mpc_q_quat: 5.0
  mpc_q_vel: 2.0
  mpc_q_omega: 0.5
  mpc_r_u: 0.02
  max_thruster_force: 40.0
  thrust_axis: 0
  random_target_pos: true
  target_pos_min:
  - -1.0
  - -1.0
  - 1.5
  target_pos_max:
  - 1.0
  - 1.0
  - 2.5
  terminate_distance: 10.0
  terminate_min_z: 0.1
  action_transform: null
  use_internal_mpc: false
algo:
  name: ppo_pypose_mpc_qrdiag
  train_every: 32
  ppo_epochs: 4
  num_minibatches: 16
  priv_actor: false
  priv_critic: false
  checkpoint_path: null
  entropy_coef: 0.001
  clip_param: 0.1
  actor_std: 0.15
  obs_has_target_quat: false
  obs_time_encoding_dim: 0
  mpc_dt: 0.05
  mpc_horizon: 15
  mpc_nu: 6
  mpc_ilqr_iters: 6
  mpc_ilqr_reg: 0.001
  terminal_weight_mult: 10.0
  max_thruster_force: 40.0
  mpc_param_yaml: null
  mpc_alloc_npz: null
  mpc_mass: null
  mpc_inertia: null
  water_density: 997.0
  gravity: 9.81
  wx_lb: 0.001
  wx_ub: 100.0
  wu_lb: 0.0001
  wu_ub: 1.0
  weights_log_scale: true
  cost_hidden: 256
  wx_init: null
  wu_init: null
headless: true
enable_livestream: false
mode: train
sim: ${task.sim}
env:
  num_envs: 10
  env_spacing: ${task.env.env_spacing}
  max_episode_length: ${task.env.max_episode_length}
total_frames: 5000000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
viewer:
  resolution:
  - 2460
  - 1440
  eye:
  - 8
  - 0.0
  - 6.0
  lookat:
  - 0.0
  - 0.0
  - 3.0
wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-${oc.select:..task.drone_model.name,none}
  job_type: train
  entity: your_wandb_entity_here
  project: marine_gym
  mode: offline
  run_id: null
  monitor_gym: true
  tags: null
