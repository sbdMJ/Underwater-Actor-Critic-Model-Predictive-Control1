# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    # MARINEGYM_ROOT is set by entry scripts based on this repo's location.
    - file://${oc.env:MARINEGYM_ROOT}/cfg

headless: false
enable_livestream: true
mode: train

sim: ${task.sim}
env:
  num_envs: ${task.env.num_envs}
  env_spacing: ${task.env.env_spacing}
  max_episode_length: ${task.env.max_episode_length}

total_frames: 40_000_000 #20_000_000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
resume_ckpt: null
resume_frames: null
resume_iter: null
save_resume_state: true

# scripts/test_pypose_mpc.py overrides (Hydra strict mode friendly)
mpc_test_steps: 5000
ppo_test_steps: 32
mpc_alloc_path: /tmp/marinegym/pypose_mpc_thruster_alloc.npz

# scripts/test_sequential_rotors.py defaults (Hydra strict mode friendly)
rotor_test_duration_s: 5.0
rotor_test_throttle: 0.5
rotor_test_rest_s: 1.0
rotor_test_print_alloc: false
rotor_test_debug_wrench: false
rotor_test_print_rotor_axes: false
rotor_test_debug_wz: false
rotor_test_mode: sequential
rotor_test_indices: null

# scripts/spawn_hover.py defaults (Hydra strict mode friendly)
spawn_duration_s: 5.0

viewer:
  resolution: [2460, 1440]
  eye: [8, 0., 6.]
  lookat: [0., 0., 3.]

# Paper-friendly experiment logging (used by scripts/test_mpc_withCam.py).
exp_log:
  enable: false
  out_dir: ${oc.env:MARINEGYM_ROOT}/outputs/experiment_logs
  run_name: ""
  save_npz: true
  save_csv: false
  plot: true
  plot_num_points: 200
  flush_interval_steps: 0  # 0 disables periodic saving
  flush_plot: false  # save plot on each flush

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}-${oc.select:..task.drone_model.name,none}
  job_type: train
  # Set to your W&B username/team (or override with `wandb.entity=...`).
  # If null, wandb uses your default entity from `wandb login`/`WANDB_ENTITY`.
  entity: null
  project: marine_gym
  mode: online # set to 'offline' when debugging locally
  run_id:
  monitor_gym: True
  tags:

defaults:
  - task: Hover
  - algo: ppo
  - _self_
